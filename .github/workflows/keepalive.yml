name: Keepalive Supabase

# Proyek Supabase gratis di-pause setelah sekitar 7 hari tanpa aktivitas database.
# Workflow ini memanggil fungsi ping() tiap 3 hari supaya proyek tetap aktif.
# Catatan: GitHub menonaktifkan workflow terjadwal di repo publik yang tidak ada
# aktivitasnya selama 60 hari. Jika itu terjadi, aktifkan lagi dari tab Actions.

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://uxpwsbgukkjvmvowuzyz.supabase.co
          SUPABASE_KEY: sb_publishable_XOZjfD0rmZLN8BHYiPCtLg_w2WenIU1
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          cat /tmp/out.txt
          echo
          test "$code" -ge 200 -a "$code" -lt 300
